apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: online-boutique
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/[tên-github-của-bạn]/[tên-repo].git' # Sửa lại link repo nhóm
    targetRevision: main
    path: k8s-manifests/online-boutique
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true