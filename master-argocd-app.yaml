apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: thesis-master-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/tam0624/uit-devops-capstone-project.git'
    targetRevision: main
    # [SỬA ĐƯỜNG DẪN]: Chỉ trỏ vào thư mục cấu hình của ArgoCD
    path: k8s-manifests/argocd 
    # [XÓA BỎ KHỐI directory.recurse]
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
